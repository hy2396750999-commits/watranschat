name: Build WATransChat IPA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned .app
        run: |
          set -euxo pipefail
          xcodebuild -project ios/WATransChat/WATransChat.xcodeproj \
            -target WATransChat \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build
      - name: Package unsigned .ipa
        run: |
          set -euxo pipefail
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -type d | head -n 1)
          mkdir -p ipa/Payload
          cp -R "$APP_PATH" ipa/Payload/
          cd ipa
          zip -qr WATransChat-unsigned.ipa Payload
          cd ..
          ls -la ipa/WATransChat-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: WATransChat-unsigned-ipa
          path: ipa/WATransChat-unsigned.ipa
